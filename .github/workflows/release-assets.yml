name: Upload Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload assets for (e.g. v1.0.0)'
        required: true

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.tag || github.event.release.tag_name }}
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.24'
    - name: Build
      run: |
        GOOS=${{ matrix.os }}
        GOARCH=${{ matrix.arch }}
        BINARY_NAME=aperiodic
        if [ "$GOOS" = "windows" ]; then BINARY_NAME=aperiodic.exe; fi
        mkdir -p dist
        GOARCH=$GOARCH GOOS=$GOOS go build -o dist/aperiodic-$GOOS-$GOARCH${BINARY_NAME#aperiodic} ./cmd/aperiodic
    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: aperiodic-${{ matrix.os }}-${{ matrix.arch }}
        path: dist/

  upload:
    name: Upload to Release
    runs-on: ubuntu-latest
    needs: build
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
    - name: Prepare assets
      run: |
        mkdir -p release
        cp artifacts/aperiodic-*/* release/
    - name: Upload assets to release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag || github.event.release.tag_name }}
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Check out default branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.repository.default_branch }}
    - name: Update README release links
      env:
        TAG: ${{ inputs.tag || github.event.release.tag_name }}
      run: |
        python - <<'PY'
        from pathlib import Path
        import re
        import os

        tag = os.environ["TAG"]
        readme = Path("README.md")
        content = readme.read_text()
        tag_pattern = r"v?[0-9]+(?:\.[0-9]+){2}(?:[-+][A-Za-z0-9._-]+)?"
        content = re.sub(
            rf"https://github\.com/aperiodic-io/cli/releases/tag/{tag_pattern}",
            f"https://github.com/aperiodic-io/cli/releases/tag/{tag}",
            content,
        )
        content = re.sub(
            rf"https://github\.com/aperiodic-io/cli/releases/download/{tag_pattern}",
            f"https://github.com/aperiodic-io/cli/releases/download/{tag}",
            content,
        )
        readme.write_text(content)
        PY
    - name: Commit README update
      env:
        TAG: ${{ inputs.tag || github.event.release.tag_name }}
      run: |
        if git diff --quiet README.md; then
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add README.md
        git commit -m "docs: update README release links for ${TAG}"
        git push
